name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build Frontend
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run Go Tests
        run: go test -race -count=1 -v ./...

      - name: Build Binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/zetnix ./cmd/zetnix
